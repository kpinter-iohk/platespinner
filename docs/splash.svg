<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <rect width="800" height="340" rx="16" fill="#1e2230"/>
  <line x1="60" y1="232" x2="740" y2="232" stroke="#3a4256" stroke-width="2"/>

  <g stroke="#8a93a6" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="112" x2="120" y2="230"/>
    <line x1="260" y1="112" x2="260" y2="230"/>
    <line x1="400" y1="112" x2="400" y2="230"/>
    <line x1="540" y1="112" x2="540" y2="230"/>
    <line x1="680" y1="112" x2="680" y2="230"/>
  </g>

  <!-- spinning plates -->
  <g fill="#3a4256" stroke="#bebebe" stroke-width="3">
    <ellipse cx="120" cy="100" rx="48" ry="12"/>
    <ellipse cx="260" cy="100" rx="48" ry="12"/>
    <ellipse cx="400" cy="100" rx="48" ry="12"/>
    <ellipse cx="680" cy="100" rx="48" ry="12"/>
  </g>
  <g fill="none" stroke="#bebebe" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M62 92 A58 18 0 0 1 100 82"/>
    <path d="M178 108 A58 18 0 0 1 140 118"/>
    <path d="M202 92 A58 18 0 0 1 240 82"/>
    <path d="M318 108 A58 18 0 0 1 280 118"/>
    <path d="M342 92 A58 18 0 0 1 380 82"/>
    <path d="M458 108 A58 18 0 0 1 420 118"/>
    <path d="M622 92 A58 18 0 0 1 660 82"/>
    <path d="M738 108 A58 18 0 0 1 700 118"/>
  </g>

  <!-- the forgotten one, wobbling -->
  <ellipse cx="540" cy="102" rx="48" ry="12" fill="#f5a623" stroke="#f5a623" stroke-width="3" transform="rotate(-16 540 102)"/>
  <g fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round">
    <path d="M478 128 q-8 10 0 20"/>
    <path d="M466 124 q-10 14 0 28"/>
    <path d="M602 76 q8 10 0 20"/>
  </g>

  <!-- notification -->
  <g font-family="system-ui, sans-serif">
    <rect x="566" y="18" width="206" height="48" rx="8" fill="#2b3142" stroke="#f5a623" stroke-width="1.5"/>
    <text x="580" y="38" font-size="13" font-weight="600" fill="#e8ebf2">Waiting on you: done</text>
    <g font-size="12" fill="#f5a623"><text x="580" y="56">Jump</text><text x="624" y="56">Snooze</text><text x="682" y="56">Mute</text></g>

    <text x="400" y="282" font-size="40" font-weight="700" fill="#e8ebf2" text-anchor="middle">platespinner</text>
    <text x="400" y="314" font-size="18" fill="#9aa3b5" text-anchor="middle">Keep every Claude Code session spinning.</text>
  </g>
</svg>
